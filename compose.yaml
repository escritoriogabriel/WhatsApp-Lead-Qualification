services:
  # OpenWA — gateway self-hosted de WhatsApp (sessão, envio, recebimento, webhooks).
  # Imagem oficial fixada por versão; não use :latest em operação.
  openwa:
    image: ${OPENWA_IMAGE:-rmyndharis/openwa:0.30.3}
    restart: unless-stopped
    stop_grace_period: 75s
    environment:
      NODE_ENV: production
      # Chave ADMIN de instalação. Guarde-a fora do repositório e não a use no navegador.
      API_MASTER_KEY: ${OPENWA_API_MASTER_KEY:-}
      # whatsapp-web.js é obrigatório: é o único mecanismo que lê etiquetas (autorização do bot).
      ENGINE_TYPE: whatsapp-web.js
      # Permite webhook para o host interno do Compose. Só use em rede privada controlada.
      WEBHOOK_SSRF_PROTECT: ${OPENWA_WEBHOOK_SSRF_PROTECT:-false}
    ports:
      - "127.0.0.1:2785:2785"
    volumes:
      - openwa_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:2785/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:gows}
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY:?Defina WAHA_API_KEY no arquivo .env}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?Defina WAHA_DASHBOARD_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - waha_sessions:/app/.sessions

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-openwa}
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: 3000
      OPENWA_BASE_URL: http://openwa:2785
      OPENWA_WEBHOOK_URL: http://app:3000/api/openwa/webhook
      WAHA_API_URL: http://waha:3000
      WAHA_WEBHOOK_URL: http://app:3000/api/waha/webhook
      OLLAMA_API_URL: ${OLLAMA_API_URL_DOCKER:-http://host.docker.internal:11434}
      WAHA_API_KEY: ${WAHA_API_KEY:?Defina WAHA_API_KEY no arquivo .env}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:?Defina WAHA_WEBHOOK_SECRET no arquivo .env}
    depends_on:
      openwa:
        condition: service_started
      waha:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config

volumes:
  openwa_data:
  waha_sessions:
